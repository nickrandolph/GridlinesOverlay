name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Install workloads
      run: |
        dotnet workload install android wasm-tools
        
    - name: Restore dependencies
      run: dotnet restore GridlinesOverlay.sln
      
    - name: Build library
      run: dotnet build src/GridlinesOverlay.Controls/GridlinesOverlay.Controls.csproj -c ${{ env.CONFIGURATION }} --no-restore
      
    - name: Build sample app (desktop only)
      run: dotnet build samples/GridlinesOverlay.Sample/GridlinesOverlay.Sample/GridlinesOverlay.Sample.csproj -c ${{ env.CONFIGURATION }} -f net10.0-desktop --no-restore
      
    - name: Pack NuGet package
      run: dotnet pack src/GridlinesOverlay.Controls/GridlinesOverlay.Controls.csproj -c ${{ env.CONFIGURATION }} --no-build -o ./artifacts
      
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
        
  publish:
    name: Publish to NuGet
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Download NuGet package
      uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      continue-on-error: true
